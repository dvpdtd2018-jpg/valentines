<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine? ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffccd5, #fff0f5);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  position: relative;
}

/* PHOTO BACKGROUND */
#photoLayer {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* MAIN CARD */
.container {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  padding: 40px 30px;
  border-radius: 30px;
  box-shadow: 0 20px 40px rgba(201, 24, 74, 0.2);
  max-width: 400px;
  width: 90%;
  text-align: center;
  transition: all 0.4s ease;
}

h1 { color: #c9184a; }

p {
  color: #555;
  min-height: 40px;
  transition: opacity 0.4s ease;
}

/* BUTTON STACK */
.buttons {
  margin-top: 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  transition: all 0.4s ease;
}

button {
  border: none;
  padding: 14px 35px;
  font-size: 18px;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.5s ease;
}

#yesBtn {
  background-color: #38b000;
  color: white;
  font-weight: 600;
}

#noBtn {
  background-color: #d90429;
  color: white;
}

/* POLAROID */
.polaroid {
  position: absolute;
  width: 140px;
  background: white;
  padding: 10px 10px 30px 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  border-radius: 6px;
  animation: dropIn 0.6s ease forwards;
}

.polaroid img {
  width: 100%;
  border-radius: 4px;
}

@keyframes dropIn {
  from {
    transform: translateY(-200px) rotate(var(--rotation));
    opacity: 0;
  }
  to {
    transform: translateY(0px) rotate(var(--rotation));
    opacity: 1;
  }
}

/* TAKEOVER MODE */
.card.takeover {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.card.takeover p,
.card.takeover #noBtn {
  opacity: 0;
  pointer-events: none;
}

.card.takeover #yesBtn {
  transform: scale(1.6);
  margin-top: 20px;
}

</style>
</head>

<body>

<div id="photoLayer"></div>

<div class="container">
  <div class="card" id="card">
    <h1>Will you be my Valentine? ❤️</h1>
    <p id="message">I promise it'll be sweet 🌸</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💚</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");
const photoLayer = document.getElementById("photoLayer");
const card = document.getElementById("card");

let noClickCount = 0;
let yesScale = 1;

const messages = [
  "Are you sure? 🥺",
  "Maybe give it another thought? 🌸",
  "I’ll bring flowers though 🌷",
  "I’ll be very sweet about it 💕",
  "You might regret pressing no 😭",
  "Okay but... please? 🥹",
  "Look at all these memories though 🥺"
];

const photos = [
  "chotdon/1.JPG",
  "chotdon/2.JPG",
  "chotdon/3.JPG",
  "chotdon/4.JPG",
  "chotdon/5.JPG",
  "chotdon/6.JPG",
  "chotdon/7.JPG",
  "chotdon/8.JPG"
];

let photoIndex = 0;

/* NO CLICK */
noBtn.addEventListener("click", () => {

  noClickCount++;

  yesScale += 0.1;
  yesBtn.style.transform = `scale(${yesScale})`;

  if (noClickCount <= messages.length) {
    message.textContent = messages[noClickCount - 1];
  }

  for (let i = 0; i < 2; i++) {
    spawnPolaroid(photos[photoIndex % photos.length]);
    photoIndex++;
  }

  if (noClickCount === 8) {
    takeOver();
  }
});

/* CONTROLLED SPAWN */
function spawnPolaroid(src) {

  const polaroid = document.createElement("div");
  polaroid.className = "polaroid";

  const img = document.createElement("img");
  img.src = src;
  polaroid.appendChild(img);

  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;

  const centerYOptions = [
    screenHeight / 10,
    screenHeight * 14 / 15
  ];

  const chosenCenterY = centerYOptions[Math.floor(Math.random() * 2)];
  const randomX = Math.random() * (screenWidth - 160);

  polaroid.style.left = randomX + "px";
  polaroid.style.top = (chosenCenterY - 110) + "px";

  const rotation = (Math.random() * 30 - 15) + "deg";
  polaroid.style.setProperty("--rotation", rotation);

  photoLayer.appendChild(polaroid);
}

/* TAKEOVER */
function takeOver() {

  noBtn.disabled = true;
  yesBtn.textContent = "YES❤️❤️❤️❤️";

  card.classList.add("takeover");
}

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:linear-gradient(180deg,#ffccd5,#fff0f5);
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      text-align:center;
      color:#c9184a;
      font-size:26px;
      font-weight:600;
    ">
      Yayyy ❤️ Redirecting...
    </div>
  `;

  setTimeout(() => {
    window.location.href = "soc.html";
  }, 1500);
});
</script>

</body>
</html>
